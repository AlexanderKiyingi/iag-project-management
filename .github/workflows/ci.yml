name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iag
          POSTGRES_PASSWORD: iag_dev
          POSTGRES_DB: iag_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iag -d iag_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Create service schema
        env:
          PGPASSWORD: iag_dev
        run: psql -h localhost -U iag -d iag_platform -c 'CREATE SCHEMA IF NOT EXISTS iag_pm;'

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Point meta-repo replaces at the vendored copies
        # go.mod's `replace => ../../../shared/...` paths only exist inside the
        # meta-repo, which is private — cloning it here needed a credential the
        # runner does not have and failed every run since. The Dockerfile
        # builds Railway from the committed third_party/ snapshots
        # (scripts/sync-platform-go.sh refreshes them); test the same code.
        run: |
          go mod edit \
            -replace=github.com/alvor-technologies/iag-platform-go=./third_party/platform-go \
            -replace=github.com/alvor-technologies/iag-chat-client=./third_party/chat-client

      - name: go mod tidy
        run: go mod tidy

      - name: Build
        run: go build -v ./...
        env:
          DATABASE_URL: postgres://iag:iag_dev@localhost:5432/iag_platform?sslmode=disable&search_path=iag_pm

      - name: Test
        run: go test ./...
        env:
          DATABASE_URL: postgres://iag:iag_dev@localhost:5432/iag_platform?sslmode=disable&search_path=iag_pm

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build production image (standalone target)
        run: docker build --target standalone -t iag-project-management:ci .
