openapi: 3.1.0
info:
  title: IAG Project Management API
  version: 1.0.0
  description: |
    Workspace-document API for the IAG Project Management service.
    Frontends should typically call through the api-gateway at
    `/api/v1/project-management/*`; the paths below are the suffix
    after that prefix is stripped.

    The companion narrative is `docs/FRONTEND_INTEGRATION.md`. Endpoint
    surface here is hand-maintained — keep both files in sync when
    adding or changing routes.

servers:
  - url: https://iag-api-gateway-production.up.railway.app/api/v1/project-management
    description: Production via gateway
  - url: http://localhost:8080/api/v1/project-management
    description: Local via gateway
  - url: http://localhost:4102
    description: Local direct (no gateway)

tags:
  - name: health
  - name: workspace
  - name: tasks
  - name: subtasks
  - name: sections
  - name: tags
  - name: dependencies
  - name: comments
  - name: entity-comments
  - name: goals
  - name: key-results
  - name: sprints
  - name: chats
  - name: messages
  - name: reactions
  - name: projects
  - name: project-status
  - name: custom-fields
  - name: requisitions
  - name: files
  - name: members
  - name: workload
  - name: settings
  - name: realtime
  - name: search
  - name: audit
  - name: approvals
  - name: templates
  - name: rules
  - name: recurrence

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    EntityID:
      in: path
      name: id
      required: true
      schema: { type: integer }
    Emoji:
      in: path
      name: emoji
      required: true
      schema: { type: string }
    WorkspaceUser:
      in: header
      name: X-Workspace-User
      schema: { type: string }
      description: Display identifier of the actor (initials etc.).
    IfMatch:
      in: header
      name: If-Match
      schema: { type: integer }
      description: Expected workspace version for optimistic locking.
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
      required: [error]
    WorkspaceEnvelope:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Document' }
        version: { type: integer, format: int64 }
      required: [data, version]
    Document:
      type: object
      description: Full workspace document; fields are append-only. Frontends should treat unknown fields as forward-compatible.
      additionalProperties: true
    Task:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        project: { type: string, description: "Legacy mirror of projects[0]. Both fields stay in sync." }
        projects: { type: array, items: { type: string }, description: "Multi-homed project IDs; first element mirrors `project`." }
        section: { type: string }
        sectionId: { type: integer }
        assignee: { type: string }
        due: { type: string, description: "Legacy single-date field; for new code prefer startDate/endDate." }
        startDate: { type: string }
        endDate: { type: string }
        priority: { type: string }
        status: { type: string }
        done: { type: boolean }
        desc: { type: string }
        type: { type: string, enum: [task, milestone, approval], description: "Empty defaults to task." }
        approvers: { type: array, items: { type: string }, description: "Required signoffs for approval-type tasks." }
        approvedBy: { type: array, items: { type: string }, description: "Actors who have approved so far." }
        recurrence:
          type: object
          nullable: true
          properties:
            pattern: { type: string, enum: [daily, weekly, monthly] }
            interval: { type: integer }
            endDate: { type: string }
            nextDueAt: { type: string, description: "Server-managed cursor." }
        deletedAt: { type: string, description: "Set when soft-deleted; restore via POST /tasks/:id/restore." }
        subtasks: { type: array, items: { type: string }, description: "Legacy name-only mirror of Subtask entities under Document.subtaskEntities." }
        tags: { type: array, items: { type: string } }
        dependsOn: { type: array, items: { type: integer } }
        sprintId: { type: integer }
        customValues: { type: object, additionalProperties: { type: string } }
    Section:
      type: object
      properties:
        id: { type: integer }
        projectId: { type: string }
        name: { type: string }
        order: { type: integer }
      required: [id, projectId, name]
    KeyResult:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        metric: { type: string }
        current: { type: number }
        target: { type: number }
        unit: { type: string }
      required: [id, name, target]
    EntityComment:
      type: object
      properties:
        id: { type: integer }
        entityType: { type: string, enum: [project, goal, sprint] }
        entityId: { type: string }
        author: { type: string }
        text: { type: string }
        mentions: { type: array, items: { type: string } }
        time: { type: string }
    ProjectStatusUpdate:
      type: object
      properties:
        id: { type: integer }
        author: { type: string }
        status: { type: string, enum: [on_track, at_risk, off_track] }
        summary: { type: string }
        time: { type: string }
    MemberWorkload:
      type: object
      properties:
        userId: { type: string }
        initials: { type: string }
        name: { type: string }
        openTasks: { type: integer }
        dueInWindow: { type: integer }
        overdue: { type: integer }
    CustomFieldDef:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [text, number, date, select, multi_select, people] }
        options: { type: array, items: { type: string } }
      required: [id, name, type]
    Subtask:
      type: object
      properties:
        id: { type: integer }
        parentTaskId: { type: integer }
        name: { type: string }
        assignee: { type: string }
        due: { type: string }
        done: { type: boolean }
        order: { type: integer }
      required: [id, parentTaskId, name]
    Message:
      type: object
      properties:
        id: { type: integer }
        chatId: { type: integer }
        author: { type: string }
        text: { type: string }
        replyTo: { type: integer, nullable: true }
        time: { type: string }
        reactions:
          type: object
          additionalProperties: { type: array, items: { type: string } }
        edited: { type: boolean }
        deleted: { type: boolean }
        readBy: { type: array, items: { type: string } }
        reminderAt: { type: string, nullable: true }

security:
  - bearer: []

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      security: []
      responses:
        '200': { description: ok }
  /health:
    get:
      tags: [health]
      summary: Liveness probe (alias)
      security: []
      responses:
        '200': { description: ok }
  /ready:
    get:
      tags: [health]
      summary: Readiness probe (pings database)
      security: []
      responses:
        '200': { description: ready }
        '503': { description: degraded }

  /api/v1/workspace:
    get:
      tags: [workspace]
      summary: Load the workspace document
      responses:
        '200':
          description: workspace
          content:
            application/json: { schema: { $ref: '#/components/schemas/WorkspaceEnvelope' } }
    put:
      tags: [workspace]
      summary: Replace the workspace document (optimistic-locked)
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { $ref: '#/components/schemas/Document' }
                version: { type: integer, format: int64 }
              required: [data]
      responses:
        '200': { description: updated, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceEnvelope' } } } }
        '409': { description: version conflict, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/ws/workspace:
    get:
      tags: [realtime]
      summary: WebSocket — full-document push on every mutation
      description: 'Upgrade with `?token=<jwt>`. Server sends `{type:"workspace", data: Document, version}` on every successful mutation.'
      parameters:
        - in: query
          name: token
          required: true
          schema: { type: string }
      responses:
        '101': { description: switching protocols }

  /api/v1/tasks:
    post:
      tags: [tasks]
      summary: Create a task
      parameters:
        - $ref: '#/components/parameters/WorkspaceUser'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                desc: { type: string }
                project: { type: string }
                section: { type: string }
                assignee: { type: string }
                priority: { type: string }
                due: { type: string }
                startDate: { type: string }
                endDate: { type: string }
                sprintId: { type: integer, nullable: true }
              required: [name]
      responses:
        '200':
          description: created
          content:
            application/json:
              schema:
                type: object
                properties:
                  task: { $ref: '#/components/schemas/Task' }
                  version: { type: integer }
  /api/v1/tasks/{id}:
    patch:
      tags: [tasks]
      summary: Patch a task (partial update)
      parameters:
        - $ref: '#/components/parameters/EntityID'
        - $ref: '#/components/parameters/WorkspaceUser'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Task' }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceEnvelope' } } } }
  /api/v1/tasks/bulk:
    post:
      tags: [tasks]
      summary: Bulk-create tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tasks:
                  type: array
                  items: { $ref: '#/components/schemas/Task' }
              required: [tasks]
      responses:
        '200':
          description: created
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks: { type: array, items: { $ref: '#/components/schemas/Task' } }
                  version: { type: integer }
  /api/v1/tasks/bulk-patch:
    post:
      tags: [tasks]
      summary: Bulk-patch tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                patches:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: integer }
                      patch: { type: object, additionalProperties: true }
                    required: [id, patch]
              required: [patches]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceEnvelope' } } } }
  /api/v1/tasks/delete-batch:
    post:
      tags: [tasks]
      summary: Bulk-delete tasks by id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, items: { type: integer } }
              required: [ids]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceEnvelope' } } } }
  /api/v1/tasks/{id}/tags:
    post:
      tags: [tags]
      summary: Add a tag to a task
      parameters: [{ $ref: '#/components/parameters/EntityID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tag: { type: string }
              required: [tag]
      responses:
        '200': { description: ok }
  /api/v1/tasks/{id}/tags/{tag}:
    delete:
      tags: [tags]
      summary: Remove a tag from a task
      parameters:
        - $ref: '#/components/parameters/EntityID'
        - in: path
          name: tag
          required: true
          schema: { type: string }
      responses:
        '200': { description: ok }
  /api/v1/tasks/{id}/custom/{field}:
    patch:
      tags: [tasks]
      summary: Set a custom field value on a task
      parameters:
        - $ref: '#/components/parameters/EntityID'
        - in: path
          name: field
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value: { type: string }
              required: [value]
      responses:
        '200': { description: ok }
  /api/v1/tasks/{id}/deps:
    post:
      tags: [dependencies]
      summary: Add a dependency to a task
      parameters: [{ $ref: '#/components/parameters/EntityID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                depId: { type: integer }
              required: [depId]
      responses:
        '200': { description: ok }
  /api/v1/tasks/{id}/deps/{depId}:
    delete:
      tags: [dependencies]
      summary: Remove a dependency from a task
      parameters:
        - $ref: '#/components/parameters/EntityID'
        - in: path
          name: depId
          required: true
          schema: { type: integer }
      responses:
        '200': { description: ok }
  /api/v1/tasks/{id}/comments:
    post:
      tags: [comments]
      summary: Add a comment to a task
      parameters:
        - $ref: '#/components/parameters/EntityID'
        - $ref: '#/components/parameters/WorkspaceUser'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string }
              required: [text]
      responses:
        '200': { description: ok }
  /api/v1/comments/{id}:
    delete:
      tags: [comments]
      summary: Delete a comment
      parameters: [{ $ref: '#/components/parameters/EntityID' }]
      responses:
        '200': { description: ok }

  /api/v1/tasks/{id}/subtasks:
    post:
      tags: [subtasks]
      summary: Create a subtask under a task
      parameters:
        - $ref: '#/components/parameters/EntityID'
        - $ref: '#/components/parameters/WorkspaceUser'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                assignee: { type: string }
                due: { type: string }
              required: [name]
      responses:
        '200':
          description: created
          content:
            application/json:
              schema:
                type: object
                properties:
                  subtask: { $ref: '#/components/schemas/Subtask' }
                  version: { type: integer }
  /api/v1/tasks/{id}/subtasks/reorder:
    post:
      tags: [subtasks]
      summary: Reorder a task's subtasks
      parameters: [{ $ref: '#/components/parameters/EntityID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                order:
                  type: array
                  items: { type: integer }
              required: [order]
      responses:
        '200': { description: ok }
  /api/v1/subtasks/{id}:
    patch:
      tags: [subtasks]
      summary: Patch a subtask
      parameters: [{ $ref: '#/components/parameters/EntityID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Subtask' }
      responses:
        '200': { description: ok }
    delete:
      tags: [subtasks]
      summary: Delete a subtask
      parameters: [{ $ref: '#/components/parameters/EntityID' }]
      responses:
        '200': { description: ok }

  /api/v1/tasks/{id}/restore:
    post:
      tags: [tasks]
      summary: Restore a soft-deleted task
      parameters: [{ $ref: '#/components/parameters/EntityID' }]
      responses: { '200': { description: ok } }
  /api/v1/tasks/{id}/projects:
    post:
      tags: [tasks]
      summary: Add a project to a task (multi-home)
      parameters: [{ $ref: '#/components/parameters/EntityID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                projectId: { type: string }
              required: [projectId]
      responses: { '200': { description: ok } }
  /api/v1/tasks/{id}/projects/{projectId}:
    delete:
      tags: [tasks]
      summary: Remove a project from a task
      parameters:
        - $ref: '#/components/parameters/EntityID'
        - in: path
          name: projectId
          required: true
          schema: { type: string }
      responses: { '200': { description: ok } }

  /api/v1/sections/{id}:
    patch:
      tags: [sections]
      summary: Rename or reorder a section
      parameters: [{ $ref: '#/components/parameters/EntityID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                order: { type: integer }
      responses: { '200': { description: ok } }
    delete:
      tags: [sections]
      summary: Delete a section
      parameters: [{ $ref: '#/components/parameters/EntityID' }]
      responses: { '200': { description: ok } }

  /api/v1/custom-fields/{id}:
    put:
      tags: [custom-fields]
      summary: Create or update a typed custom field definition
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomFieldDef' }
      responses: { '200': { description: ok } }
    delete:
      tags: [custom-fields]
      summary: Delete a custom field (clears values across all tasks)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses: { '200': { description: ok } }

  /api/v1/workspace/workload:
    get:
      tags: [workload]
      summary: Per-member workload counts (open tasks, due-in-window, overdue)
      parameters:
        - in: query
          name: period
          schema: { type: string, enum: [day, week, month] }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  workload: { type: array, items: { $ref: '#/components/schemas/MemberWorkload' } }
                  windowDays: { type: integer }

  /api/v1/projects/{id}/sections:
    post:
      tags: [sections]
      summary: Create a section under a project
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
              required: [name]
      responses: { '200': { description: ok } }
  /api/v1/projects/{id}/sections/reorder:
    post:
      tags: [sections]
      summary: Reorder a project's sections
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                order: { type: array, items: { type: integer } }
              required: [order]
      responses: { '200': { description: ok } }
  /api/v1/projects/{id}/status:
    post:
      tags: [project-status]
      summary: Post a status update on a project
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [on_track, at_risk, off_track] }
                summary: { type: string }
              required: [status]
      responses: { '200': { description: ok } }
    get:
      tags: [project-status]
      summary: List a project's status history (newest first)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusHistory:
                    type: array
                    items: { $ref: '#/components/schemas/ProjectStatusUpdate' }
  /api/v1/projects/{id}/comments:
    post:
      tags: [entity-comments]
      summary: Comment on a project
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string }
              required: [text]
      responses: { '200': { description: ok } }
  /api/v1/goals/{id}/comments:
    post:
      tags: [entity-comments]
      summary: Comment on a goal
      parameters: [{ $ref: '#/components/parameters/EntityID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string }
              required: [text]
      responses: { '200': { description: ok } }
  /api/v1/sprints/{id}/comments:
    post:
      tags: [entity-comments]
      summary: Comment on a sprint
      parameters: [{ $ref: '#/components/parameters/EntityID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string }
              required: [text]
      responses: { '200': { description: ok } }
  /api/v1/entity-comments/{id}:
    delete:
      tags: [entity-comments]
      summary: Delete a polymorphic comment (project/goal/sprint)
      parameters: [{ $ref: '#/components/parameters/EntityID' }]
      responses: { '200': { description: ok } }

  /api/v1/goals/{id}/key-results:
    post:
      tags: [key-results]
      summary: Add a Key Result to a Goal (OKR)
      parameters: [{ $ref: '#/components/parameters/EntityID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                metric: { type: string }
                current: { type: number }
                target: { type: number }
                unit: { type: string }
              required: [name, target]
      responses: { '200': { description: ok } }
  /api/v1/goals/{id}/key-results/{krId}:
    patch:
      tags: [key-results]
      summary: Patch a Key Result (recomputes goal progress)
      parameters:
        - $ref: '#/components/parameters/EntityID'
        - in: path
          name: krId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KeyResult' }
      responses: { '200': { description: ok } }
    delete:
      tags: [key-results]
      summary: Delete a Key Result
      parameters:
        - $ref: '#/components/parameters/EntityID'
        - in: path
          name: krId
          required: true
          schema: { type: integer }
      responses: { '200': { description: ok } }

  /api/v1/goals:
    post:
      tags: [goals]
      summary: Create a goal
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses: { '200': { description: ok } }
  /api/v1/goals/{id}:
    patch:
      tags: [goals]
      summary: Patch a goal
      parameters: [{ $ref: '#/components/parameters/EntityID' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses: { '200': { description: ok } }
    delete:
      tags: [goals]
      summary: Delete a goal
      parameters: [{ $ref: '#/components/parameters/EntityID' }]
      responses: { '200': { description: ok } }
  /api/v1/goals/{id}/progress:
    post:
      tags: [goals]
      summary: Adjust goal progress
      parameters: [{ $ref: '#/components/parameters/EntityID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                delta: { type: integer }
              required: [delta]
      responses: { '200': { description: ok } }

  /api/v1/sprints:
    post:
      tags: [sprints]
      summary: Create a sprint
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses: { '200': { description: ok } }
  /api/v1/sprints/{id}:
    patch:
      tags: [sprints]
      summary: Patch a sprint
      parameters: [{ $ref: '#/components/parameters/EntityID' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses: { '200': { description: ok } }
    delete:
      tags: [sprints]
      summary: Delete a sprint
      parameters: [{ $ref: '#/components/parameters/EntityID' }]
      responses: { '200': { description: ok } }

  /api/v1/chats:
    post:
      tags: [chats]
      summary: Create a chat
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses: { '200': { description: ok } }
  /api/v1/chats/{id}/read:
    post:
      tags: [chats]
      summary: Mark all messages in a chat read by the actor
      parameters: [{ $ref: '#/components/parameters/EntityID' }]
      responses: { '200': { description: ok } }
  /api/v1/chats/{id}/mute:
    post:
      tags: [chats]
      summary: Toggle mute on a chat
      parameters: [{ $ref: '#/components/parameters/EntityID' }]
      responses: { '200': { description: ok } }

  /api/v1/messages:
    post:
      tags: [messages]
      summary: Post a message
      parameters: [{ $ref: '#/components/parameters/WorkspaceUser' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                chatId: { type: integer }
                text: { type: string }
                replyTo: { type: integer, nullable: true }
                edited: { type: boolean }
                deleted: { type: boolean }
                reminderAt: { type: string, nullable: true }
              required: [chatId, text]
      responses: { '200': { description: ok } }
  /api/v1/messages/{id}/reactions:
    post:
      tags: [reactions]
      summary: Add a reaction to a message
      parameters:
        - $ref: '#/components/parameters/EntityID'
        - $ref: '#/components/parameters/WorkspaceUser'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                emoji: { type: string }
              required: [emoji]
      responses: { '200': { description: ok } }
  /api/v1/messages/{id}/reactions/{emoji}:
    delete:
      tags: [reactions]
      summary: Remove the actor's reaction from a message
      parameters:
        - $ref: '#/components/parameters/EntityID'
        - $ref: '#/components/parameters/Emoji'
        - $ref: '#/components/parameters/WorkspaceUser'
      responses: { '200': { description: ok } }

  /api/v1/projects/{id}:
    put:
      tags: [projects]
      summary: Upsert a project
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses: { '200': { description: ok } }

  /api/v1/requisitions:
    post:
      tags: [requisitions]
      summary: Create a requisition (publishes pm.requisition.submitted)
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses: { '200': { description: ok } }

  /api/v1/files:
    post:
      tags: [files]
      summary: Create a file metadata entry (data stored inline or as blob)
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses: { '200': { description: ok } }
  /api/v1/files/{id}:
    get:
      tags: [files]
      summary: Download a file blob
      parameters: [{ $ref: '#/components/parameters/EntityID' }]
      responses: { '200': { description: ok } }

  /api/v1/workspace/members:
    post:
      tags: [members]
      summary: Add a member to the workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId: { type: string }
                role: { type: string }
              required: [userId, role]
      responses: { '200': { description: ok } }
  /api/v1/workspace/org:
    patch:
      tags: [members]
      summary: Set the workspace's org affinity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orgId: { type: string }
              required: [orgId]
      responses: { '200': { description: ok } }

  /api/v1/settings:
    patch:
      tags: [settings]
      summary: Update workspace UI settings
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses: { '200': { description: ok } }
  /api/v1/audit:
    delete:
      tags: [settings]
      summary: Clear the audit log
      responses: { '200': { description: ok } }

  /api/v1/tasks/{id}/approve:
    post:
      tags: [approvals]
      summary: Approve an approval-type task (X-Workspace-User must be in approvers list)
      parameters:
        - $ref: '#/components/parameters/EntityID'
        - $ref: '#/components/parameters/WorkspaceUser'
      responses: { '200': { description: ok } }
  /api/v1/tasks/{id}/reject:
    post:
      tags: [approvals]
      summary: Reject an approval-type task (clears prior approvals)
      parameters:
        - $ref: '#/components/parameters/EntityID'
        - $ref: '#/components/parameters/WorkspaceUser'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses: { '200': { description: ok } }
  /api/v1/tasks/{id}/approvers:
    patch:
      tags: [approvals]
      summary: Replace the approvers list on a task
      parameters: [{ $ref: '#/components/parameters/EntityID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                approvers: { type: array, items: { type: string } }
              required: [approvers]
      responses: { '200': { description: ok } }

  /api/v1/templates:
    get:
      tags: [templates]
      summary: List templates in the workspace
      responses: { '200': { description: ok } }
    post:
      tags: [templates]
      summary: Create a template (project|task)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type: { type: string, enum: [project, task] }
                name: { type: string }
                variables: { type: array, items: { type: string } }
                body: { type: object, additionalProperties: true }
              required: [type, name, body]
      responses: { '200': { description: ok } }
  /api/v1/templates/{id}:
    get:
      tags: [templates]
      summary: Fetch one template
      parameters: [{ $ref: '#/components/parameters/EntityID' }]
      responses: { '200': { description: ok } }
    delete:
      tags: [templates]
      summary: Delete a template
      parameters: [{ $ref: '#/components/parameters/EntityID' }]
      responses: { '200': { description: ok } }
  /api/v1/templates/{id}/apply:
    post:
      tags: [templates]
      summary: Apply a template to the current workspace with optional context substitution
      parameters: [{ $ref: '#/components/parameters/EntityID' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                context:
                  type: object
                  additionalProperties: { type: string }
      responses:
        '200':
          description: applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  applied:
                    type: object
                    properties:
                      projectId: { type: string }
                      createdTaskIds: { type: array, items: { type: integer } }
                  version: { type: integer }

  /api/v1/rules:
    get:
      tags: [rules]
      summary: List automation rules in the workspace
      responses: { '200': { description: ok } }
    post:
      tags: [rules]
      summary: Create a rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                enabled: { type: boolean }
                trigger:
                  type: string
                  enum: [task.created, task.status_changed, task.assignee_changed, comment.created]
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      field: { type: string }
                      op: { type: string, enum: [eq, ne, contains, in] }
                      value: { type: string }
                actions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        enum: [assign_to, set_status, set_due_offset, add_tag, create_subtask, post_comment, notify]
                      params:
                        type: object
                        additionalProperties: { type: string }
              required: [name, trigger, actions]
      responses: { '200': { description: ok } }
  /api/v1/rules/{id}:
    patch:
      tags: [rules]
      summary: Patch a rule (enabled/name/trigger)
      parameters: [{ $ref: '#/components/parameters/EntityID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                enabled: { type: boolean }
                trigger: { type: string }
      responses: { '200': { description: ok } }
    delete:
      tags: [rules]
      summary: Delete a rule
      parameters: [{ $ref: '#/components/parameters/EntityID' }]
      responses: { '200': { description: ok } }

  /api/v1/search:
    get:
      tags: [search]
      summary: Full-text search across tasks, projects, goals, messages
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
        - in: query
          name: type
          schema: { type: string, enum: [task, project, goal, message] }
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 200 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: ranked hits
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        entityType: { type: string }
                        entityId: { type: string }
                        projectId: { type: string }
                        title: { type: string }
                        snippet: { type: string }
                        rank: { type: number }
                  total: { type: integer }

  /api/v1/audit/requests:
    get:
      tags: [audit]
      summary: HTTP request audit log (admin only)
      parameters:
        - in: query
          name: workspaceOwnerUserId
          schema: { type: string }
        - in: query
          name: actor
          schema: { type: string }
        - in: query
          name: path
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: limit
          schema: { type: integer, default: 100, maximum: 500 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: object } }
                  limit: { type: integer }
                  offset: { type: integer }

  /api/v1/platform/status:
    get:
      tags: [health]
      summary: Platform dependency health (auth, redis, kafka)
      responses: { '200': { description: ok } }
